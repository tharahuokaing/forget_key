<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAIL ACCOUNT RECOVERY</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="casino_2.jpg" type="image/jpeg" />

</head>
<body>

        <!-- Hero Banner -->
        <section class="hero-fullscreen">
      <img 
        src="casino2.jpg" 
        alt="HUOKAING THARA CASINO 2 Grand Opening" 
        class="img-full-cover" 
        onerror="this.src='https://images.unsplash.com/photo-1518609878373-06d740f60d8b?q=80&w=1200'"
      >
      <div class="hero-overlay">
        <h1>HUOKAING THARA CASINO 2</h1>
        <p>Official Grand Opening &amp; Executive VIP Gaming Decree</p>
      </div>    
    </section>
    
    <!-- Main Viewport Trigger -->
    <main class="dashboard-viewport">
        <div class="recovery-card">
            <div class="card-content">
                <h2>ACCOUNT RECOVERY SYSTEM</h2>
                <p>Click below to begin recovering your username and password via Gmail.</p>
                <button id="forgot-key-trigger" class="btn-primary" type="button">
                    <span>🔑 FORGOT KEY?</span>
                </button>
            </div>
        </div>
    </main>

    <!-- ==========================================================================
       GMAIL RECOVERY MODAL OVERLAY
       ========================================================================== -->
    <div id="forgot-key-overlay" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-frame">
            <button id="close-forgot-btn" class="close-btn" type="button" aria-label="Close modal">&times;</button>

            <div class="modal-header">
                <span class="modal-icon">✉️</span>
                <h3 id="modal-title">GMAIL RECOVERY</h3>
                <p id="modal-subtitle">Enter your Gmail account to recover your credentials.</p>
            </div>

            <!-- Recovery Form -->
            <form id="recovery-form">
                <div class="input-field-group">
                    <label for="recovery-gmail">REGISTERED GMAIL ACCOUNT</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="recovery-gmail" placeholder="username@gmail.com" required pattern="[a-zA-Z0-9._%+-]+@gmail\.com$" autocomplete="email">
                    </div>
                </div>

                <div id="status-msg" class="status-alert hidden"></div>

                <button type="submit" id="btn-submit-gmail" class="btn-primary full-width">
                    <span>SEND RECOVERY TO GMAIL</span> 🚀
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
